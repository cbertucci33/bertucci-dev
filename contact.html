<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Source+Serif+4:opsz,wght@8..60,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

</head><body class="pg-contact">
<div class="wrap">
  <nav class="page-back"><a href="homepage.html" class="backlink">← back</a></nav>
  <header class="page-head">
    <h1>Get in touch</h1>
    <div class="page-sub">Drop me a line - it lands straight in my inbox. No account, no sign-up, just a message.</div>
  </header>

  <div class="soclinks">
    <a class="soc" href="https://www.linkedin.com/in/carmenbertucci/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(0,0.05)"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45z"/></g></svg>
      <span>LinkedIn</span>
    </a>
  </div>
<div class="page-sub socline">Or send me a message here.</div>

  <form id="contact-form" action="https://formsubmit.co/ajax/cbhex11@gmail.com" method="POST" class="cform">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required autocomplete="name" placeholder="Your name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="What's this about?">
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required placeholder="Write your message here…"></textarea>
    </div>
    <!-- honeypot: humans never see/fill this; bots do. FormSubmit discards it. -->
    <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="btn btn-primary csubmit">Send it</button>
    <div class="cstatus" id="status" role="status" hidden></div>
  </form>
</div>
<script>
const form = document.getElementById('contact-form');
const status = document.getElementById('status');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = new FormData(form);
  status.hidden = false;
  status.textContent = 'Sending…';
  status.className = 'cstatus';
  const payload = {
    name: data.get('name'),
    email: data.get('email'),
    subject: data.get('subject'),
    message: data.get('message'),
    _subject: 'Contact form: ' + (data.get('subject') || '(no subject)'),
    _template: 'table',
    _captcha: 'true'
  };
  try {
    const res = await fetch('https://formsubmit.co/ajax/cbhex11@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    const ok = res.ok;
    if (ok) {
      status.textContent = 'Sent. Thanks - I’ll get back to you.';
      status.classList.add('ok');
      form.reset();
    } else {
      status.textContent = 'Something went wrong sending. Try again?';
      status.classList.add('err');
    }
  } catch (err) {
    status.textContent = 'Could not reach the form service. Try again?';
    status.classList.add('err');
  }
});
</script>
</body></html>
